<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Series — Mac Worden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Bebas+Neue&family=Big+Shoulders+Stencil+Display:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Spectral:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0A0E14;
    --ink-2: #0E141C;
    --ink-3: #131A24;
    --paper: #EDE3D2;
    --paper-dim: #C9BFAD;
    --gold: #D9A55F;
    --gold-deep: #B5853F;
    --crimson: #8B2418;
    --muted: #6B7280;
    --border: rgba(217,165,95,0.18);
    --border-strong: rgba(217,165,95,0.35);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Spectral', Georgia, serif;
    font-weight: 300;
    line-height: 1.7;
    overflow-x: hidden;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.05;
    pointer-events: none;
    mix-blend-mode: overlay;
    z-index: 1000;
  }

  /* Falling snow */
  .snow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }
  .flake {
    position: absolute;
    top: -10px;
    width: 3px;
    height: 3px;
    background: rgba(237,227,210,0.55);
    border-radius: 50%;
    filter: blur(0.4px);
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.6; }
    100% { transform: translateY(110vh) translateX(40px); opacity: 0; }
  }

  /* ─────────── NAV ─────────── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.4rem 3rem;
    background: rgba(10,14,20,0.92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }

  .nav-brand {
    font-family: 'Big Shoulders Stencil Display', 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: 0.18em;
    color: var(--paper);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .nav-brand::before {
    content: '';
    width: 14px;
    height: 14px;
    background: var(--gold);
    clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 2.25rem;
    list-style: none;
  }
  .nav-links a {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 400;
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--paper-dim);
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--gold); }

  .btn-nav, a.btn-nav, .nav-links a.btn-nav {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #000;
    background: var(--gold);
    border: none;
    padding: 0.7rem 1.5rem;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s, box-shadow 0.2s;
    box-shadow: 0 2px 14px rgba(217,165,95,0.25);
  }
  .btn-nav:hover { background: #E8B976; }

  /* ─────────── SERIES HEADER ─────────── */
  #series-header {
    padding: 9rem 3rem 4rem;
    position: relative;
    background:
      radial-gradient(ellipse 60% 50% at 30% 30%, rgba(217,165,95,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(139,36,24,0.06) 0%, transparent 70%),
      linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    border-bottom: 1px solid var(--border);
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  .crumbs {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.75rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }
  .crumbs a {
    color: var(--paper-dim);
    text-decoration: none;
    transition: color 0.2s;
  }
  .crumbs a:hover { color: var(--gold); }
  .crumbs .sep { color: var(--gold-deep); }

  .series-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }
  .series-eyebrow::before {
    content: '';
    width: 2.5rem;
    height: 1px;
    background: var(--gold);
  }

  .series-title {
    font-family: 'Big Shoulders Stencil Display', sans-serif;
    font-weight: 700;
    font-size: clamp(3rem, 8vw, 6.5rem);
    line-height: 0.95;
    letter-spacing: 0.02em;
    color: var(--paper);
    text-transform: uppercase;
    margin-bottom: 1.25rem;
  }
  .series-title em {
    font-style: normal;
    color: var(--gold);
  }

  .series-intro {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.1rem, 1.6vw, 1.4rem);
    color: var(--paper-dim);
    max-width: 64ch;
    line-height: 1.55;
    margin-bottom: 2rem;
  }

  .series-stats {
    display: flex;
    gap: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }
  .stat-num {
    font-family: 'Big Shoulders Stencil Display', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    color: var(--gold);
    line-height: 1;
    letter-spacing: 0.02em;
  }
  .stat-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--paper-dim);
    margin-top: 0.4rem;
  }

  /* ─────────── BOOKS LIST ─────────── */
  #books {
    padding: 5rem 3rem 6rem;
    background: var(--ink-2);
  }

  .books-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 3rem;
  }
  .books-label::before {
    content: '';
    width: 2.5rem;
    height: 1px;
    background: var(--gold);
  }

  .book-row {
    display: grid;
    grid-template-columns: minmax(240px, 320px) 1fr;
    gap: 4rem;
    padding: 3rem 0;
    border-top: 1px solid var(--border);
    align-items: start;
  }
  .book-row:last-child { border-bottom: 1px solid var(--border); }

  .book-cover-wrap {
    position: relative;
    perspective: 1400px;
  }
  .book-cover {
    position: relative;
    transform: rotateY(-4deg) rotateX(1deg);
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(.2,.7,.2,1);
  }
  .book-cover:hover { transform: rotateY(0deg) rotateX(0deg) translateY(-3px); }
  .book-cover img {
    width: 100%;
    display: block;
    background: #1a1f29;
    box-shadow:
      0 0 0 1px rgba(217,165,95,0.12),
      14px 18px 48px rgba(0,0,0,0.6),
      -4px -4px 24px rgba(217,165,95,0.04);
  }
  .book-spine {
    position: absolute;
    left: -7px;
    top: 4px;
    bottom: 4px;
    width: 7px;
    background: linear-gradient(to right, #050709, #0f1118);
    transform: skewY(2deg);
  }

  .book-badge {
    position: absolute;
    top: -12px;
    left: -12px;
    background: var(--gold);
    color: #000;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    padding: 0.45rem 0.85rem;
    z-index: 3;
    box-shadow: 0 6px 18px rgba(217,165,95,0.3);
  }
  .book-badge.coming {
    background: var(--crimson);
    color: var(--paper);
    box-shadow: 0 6px 18px rgba(139,36,24,0.45);
  }

  .book-info { padding-top: 0.5rem; }

  .book-number {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .book-number .dot {
    width: 4px;
    height: 4px;
    background: var(--gold);
    border-radius: 50%;
  }
  .book-number .status {
    color: var(--paper-dim);
    letter-spacing: 0.22em;
  }

  .book-title {
    font-family: 'Big Shoulders Stencil Display', sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 4vw, 3.2rem);
    line-height: 0.98;
    letter-spacing: 0.02em;
    color: var(--paper);
    text-transform: uppercase;
    margin-bottom: 0.9rem;
  }

  .book-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.1rem, 1.5vw, 1.35rem);
    color: var(--gold);
    line-height: 1.4;
    margin-bottom: 1.5rem;
    max-width: 52ch;
  }

  .book-blurb {
    font-family: 'Spectral', serif;
    font-weight: 300;
    font-size: 1.02rem;
    line-height: 1.8;
    color: var(--paper-dim);
    max-width: 62ch;
    margin-bottom: 2rem;
  }
  .book-blurb p + p { margin-top: 1rem; }

  .book-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #000;
    background: var(--gold);
    border: none;
    padding: 0.95rem 1.8rem;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
    box-shadow: 0 2px 14px rgba(217,165,95,0.25);
  }
  .book-cta:hover {
    background: #E8B976;
    box-shadow: 0 4px 22px rgba(217,165,95,0.45);
    transform: translateY(-1px);
  }
  .book-cta .arrow { transition: transform 0.2s; }
  .book-cta:hover .arrow { transform: translateX(3px); }

  .book-cta.secondary {
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--border-strong);
    box-shadow: none;
    margin-left: 0.75rem;
  }
  .book-cta.secondary:hover {
    background: rgba(217,165,95,0.08);
    border-color: var(--gold);
    color: var(--gold);
  }

  /* Not found */
  .empty {
    text-align: center;
    padding: 8rem 1rem;
  }
  .empty h2 {
    font-family: 'Big Shoulders Stencil Display', sans-serif;
    font-weight: 700;
    font-size: 2.5rem;
    color: var(--paper);
    letter-spacing: 0.04em;
    margin-bottom: 1rem;
  }
  .empty p {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--paper-dim);
    margin-bottom: 2rem;
  }

  /* Footer */
  footer {
    background: #06080C;
    border-top: 1px solid var(--border);
    padding: 3rem 3rem 2.5rem;
  }
  .footer-grid {
    max-width: 1180px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2rem;
    align-items: center;
  }
  .footer-brand {
    font-family: 'Big Shoulders Stencil Display', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 0.12em;
    color: var(--paper);
    margin-bottom: 0.4rem;
  }
  .footer-copy {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .footer-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }
  .footer-links a {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--paper-dim);
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer-links a:hover { color: var(--gold); }

  /* Reveal */
  .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.9s ease, transform 0.9s ease; }
  .reveal.on { opacity: 1; transform: translateY(0); }

  /* Responsive */
  @media (max-width: 900px) {
    nav { padding: 1.2rem 1.5rem; }
    .nav-links li:not(:last-child) { display: none; }
    #series-header { padding: 7rem 1.5rem 3rem; }
    #books { padding: 4rem 1.5rem 5rem; }
    .book-row {
      grid-template-columns: 1fr;
      gap: 2rem;
    }
    .book-cover-wrap { max-width: 240px; }
    .footer-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="snow" id="snow"></div>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-brand">Mac Worden</a>
  <ul class="nav-links">
    <li><a href="index.html#series" class="active">Series</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#signup" class="btn-nav">Join the List</a></li>
  </ul>
</nav>

<!-- Page content rendered by JS -->
<main id="page-root"></main>

<!-- FOOTER -->
<footer>
  <div class="footer-grid">
    <div>
      <div class="footer-brand">MAC WORDEN</div>
      <div class="footer-copy">&copy; 2026 Mac Worden &middot; All Rights Reserved</div>
    </div>
    <ul class="footer-links">
      <li><a href="index.html#signup">Newsletter</a></li>
      <li><a href="index.html#series">Series</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="mailto:hello@macworden.com">Contact</a></li>
    </ul>
  </div>
</footer>

<script>
  // ─────────── Snowfall ───────────
  (function snowInit(){
    const snow = document.getElementById('snow');
    const N = 50;
    for (let i = 0; i < N; i++) {
      const f = document.createElement('div');
      f.className = 'flake';
      const size = 1 + Math.random() * 3;
      f.style.width = f.style.height = size + 'px';
      f.style.left = (Math.random() * 100) + 'vw';
      f.style.opacity = (0.3 + Math.random() * 0.5);
      f.style.animationDuration = (8 + Math.random() * 14) + 's';
      f.style.animationDelay = (-Math.random() * 18) + 's';
      f.style.filter = 'blur(' + (Math.random() * 1.2) + 'px)';
      snow.appendChild(f);
    }
  })();

  // Placeholder cover generator — used for any book without a real cover URL yet.
  function placeholderCover(title, subtitle) {
    const lines = title.toUpperCase().split(/\s+/);
    const safe = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const txtLines = lines.map((w, i) =>
      `<text x="200" y="${260 + i * 56}" text-anchor="middle" fill="#EDE3D2" font-family="Big Shoulders Stencil Display, Impact, sans-serif" font-weight="700" font-size="52" letter-spacing="2">${safe(w)}</text>`
    ).join('');
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">` +
      `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">` +
      `<stop offset="0%" stop-color="#131A24"/><stop offset="100%" stop-color="#0A0E14"/>` +
      `</linearGradient></defs>` +
      `<rect width="400" height="600" fill="url(#g)"/>` +
      `<rect x="24" y="24" width="352" height="552" fill="none" stroke="#D9A55F" stroke-opacity="0.25" stroke-width="1"/>` +
      `<text x="200" y="110" text-anchor="middle" fill="#D9A55F" font-family="Barlow Condensed, sans-serif" font-weight="500" font-size="18" letter-spacing="6">MAC WORDEN</text>` +
      `<line x1="140" y1="140" x2="260" y2="140" stroke="#D9A55F" stroke-width="1"/>` +
      txtLines +
      `<text x="200" y="520" text-anchor="middle" fill="#C9BFAD" font-family="Cormorant Garamond, serif" font-style="italic" font-size="20">${safe(subtitle || '')}</text>` +
      `</svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  // (mock BOOKS removed — data now comes from Appwrite, see module script below)

  // ─────────── Render helpers ───────────
  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&(?!(amp;|lt;|gt;|mdash;|quot;|#\d+;))/g, '&amp;')
      .replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Map Appwrite enum -> display label + CTA + badge style
  const STATUS_MAP = {
    coming_soon: { label: 'Coming Soon', cta: 'Pre-order',   badgeClass: 'book-badge coming' },
    published:   { label: 'Available Now', cta: 'Buy the Book', badgeClass: 'book-badge' },
    best_seller: { label: 'Best Seller',   cta: 'Buy the Book', badgeClass: 'book-badge' }
  };

  function renderLoading(slug) {
    const root = document.getElementById('page-root');
    root.innerHTML = `
      <section id="series-header">
        <div class="wrap">
          <div class="crumbs">
            <a href="index.html">Home</a>
            <span class="sep">/</span>
            <a href="index.html#series">Series</a>
          </div>
          <p class="series-eyebrow">Loading…</p>
          <h1 class="series-title" style="opacity:.4">${esc(slug || '')}</h1>
          <p class="series-intro" style="opacity:.5">Fetching the series and its books…</p>
        </div>
      </section>
    `;
  }

  function renderNotFound(reqId) {
    const root = document.getElementById('page-root');
    root.innerHTML = `
      <section id="series-header">
        <div class="wrap">
          <div class="crumbs">
            <a href="index.html">Home</a>
            <span class="sep">/</span>
            <a href="index.html#series">Series</a>
          </div>
          <div class="empty">
            <h2>Series Not Found</h2>
            <p>We couldn\u2019t find a series with the slug <em>&ldquo;${esc(reqId || '')}&rdquo;</em>.</p>
            <a href="index.html#series" class="book-cta">
              <span>Browse all series</span><span class="arrow">&rarr;</span>
            </a>
          </div>
        </div>
      </section>
    `;
  }

  function renderError(err) {
    const root = document.getElementById('page-root');
    const msg = (err && err.message) ? err.message : String(err);
    const hint = /401|not authorized|missing scope/i.test(msg)
      ? 'Your Appwrite collections need read permission for Role: "Any" (or the page needs to create an anonymous session). Check the series & books collections under Settings → Permissions.'
      : 'Check the Appwrite config at the top of this file (endpoint, project ID, database ID, collection IDs) and that your domain is added as a Web platform in the Appwrite console.';
    root.innerHTML = `
      <section id="series-header">
        <div class="wrap">
          <div class="crumbs">
            <a href="index.html">Home</a>
            <span class="sep">/</span>
            <a href="index.html#series">Series</a>
          </div>
          <div class="empty">
            <h2>Couldn\u2019t Load Series</h2>
            <p>${esc(msg)}</p>
            <p style="margin-top:1rem;max-width:54ch">${esc(hint)}</p>
          </div>
        </div>
      </section>
    `;
  }

  function bookCardHtml(book, idx) {
    const cover = book.cover_url && book.cover_url.length
      ? book.cover_url
      : placeholderCover(book.title, 'A Mac Worden Novel');
    const st = STATUS_MAP[book.status] || { label: book.status || '', cta: 'Buy the Book', badgeClass: 'book-badge' };
    const alt = book.cover_alt || (book.title + ' cover');
    const blurb = (book.blurb || book.card_description || '').trim();
    return `
      <article class="book-row reveal" style="transition-delay:${idx * 80}ms">
        <div class="book-cover-wrap">
          <span class="${st.badgeClass}">${esc(st.label)}</span>
          <div class="book-cover">
            <div class="book-spine"></div>
            <img src="${esc(cover)}" alt="${esc(alt)}" onerror="this.onerror=null;this.src='${esc(placeholderCover(book.title, 'A Mac Worden Novel'))}'">
          </div>
        </div>

        <div class="book-info">
          <div class="book-number">
            <span>Book ${book.series_number != null ? book.series_number : '—'}</span>
            <span class="dot"></span>
            <span class="status">${esc(st.label)}</span>
          </div>
          <h2 class="book-title">${esc(book.title)}</h2>
          ${book.tagline ? `<p class="book-tagline">${esc(book.tagline)}</p>` : ''}
          <div class="book-blurb">
            ${blurb.split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join('')}
          </div>
          ${book.store_url ? `
          <div>
            <a class="book-cta" href="${esc(book.store_url)}" target="_blank" rel="noopener">
              <span>${esc(book.store_label || st.cta)}</span>
              <span class="arrow">&rarr;</span>
            </a>
          </div>` : ''}
        </div>
      </article>
    `;
  }

  function renderSeries(series, books) {
    const available = books.filter(b => b.status === 'published' || b.status === 'best_seller').length;
    const coming = books.filter(b => b.status === 'coming_soon').length;

    const heading = series.series_heading || series.name;
    document.title = heading + ' — Mac Worden';

    const root = document.getElementById('page-root');
    root.innerHTML = `
      <section id="series-header" data-screen-label="Series Header">
        <div class="wrap">
          <div class="crumbs">
            <a href="index.html">Home</a>
            <span class="sep">/</span>
            <a href="index.html#series">Series</a>
            <span class="sep">/</span>
            <span>${esc(heading)}</span>
          </div>
          ${series.tagline ? `<p class="series-eyebrow">${esc(series.tagline)}</p>` : ''}
          <h1 class="series-title">${esc(heading)}</h1>
          ${series.description ? `<p class="series-intro">${esc(series.description)}</p>` : ''}
          <div class="series-stats">
            <div>
              <div class="stat-num">${String(books.length).padStart(2,'0')}</div>
              <div class="stat-label">${books.length === 1 ? 'Book in<br>the Series' : 'Books in<br>the Series'}</div>
            </div>
            ${available > 0 ? `
            <div>
              <div class="stat-num">${String(available).padStart(2,'0')}</div>
              <div class="stat-label">Available<br>Now</div>
            </div>` : ''}
            ${coming > 0 ? `
            <div>
              <div class="stat-num">${String(coming).padStart(2,'0')}</div>
              <div class="stat-label">Coming<br>Soon</div>
            </div>` : ''}
          </div>
        </div>
      </section>

      <section id="books" data-screen-label="Books">
        <div class="wrap">
          <p class="books-label">Books in the Series</p>
          ${books.length
            ? books.map(bookCardHtml).join('')
            : '<p class="series-intro">No books are listed for this series yet. Check back soon.</p>'}
        </div>
      </section>
    `;

    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          en.target.classList.add('on');
          io.unobserve(en.target);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  }

  // Expose to module script
  window.__renderLoading  = renderLoading;
  window.__renderNotFound = renderNotFound;
  window.__renderError    = renderError;
  window.__renderSeries   = renderSeries;
  window.__getParam       = getParam;
</script>

<!-- ─────────── Appwrite data loader ─────────── -->
<script type="module">
  // EDIT THESE if your Appwrite project changes ──────────────
  const APPWRITE_CONFIG = {
    endpoint:        'https://sfo.cloud.appwrite.io/v1',
    projectId:       '6a0b4638002a71c2b8ec',
    databaseId:      '6a0b628900008b8506e3',
    seriesCollection: 'series',
    booksCollection:  'books',
    defaultSlug:     'colby-watts'   // shown if no ?series= param
  };
  // ───────────────────────────────────────────────────────────

  import { Client, Databases, Query } from 'https://cdn.jsdelivr.net/npm/appwrite@16.0.2/+esm';

  const slug = window.__getParam('series') || APPWRITE_CONFIG.defaultSlug;
  window.__renderLoading(slug);

  try {
    const client = new Client()
      .setEndpoint(APPWRITE_CONFIG.endpoint)
      .setProject(APPWRITE_CONFIG.projectId);
    const db = new Databases(client);

    // 1) Fetch the series by slug
    const seriesRes = await db.listDocuments(
      APPWRITE_CONFIG.databaseId,
      APPWRITE_CONFIG.seriesCollection,
      [ Query.equal('slug', slug), Query.limit(1) ]
    );
    if (!seriesRes.documents.length) {
      window.__renderNotFound(slug);
    } else {
      const series = seriesRes.documents[0];

      // 2) Fetch books for that series, exclude drafts, order by series_number asc
      const booksRes = await db.listDocuments(
        APPWRITE_CONFIG.databaseId,
        APPWRITE_CONFIG.booksCollection,
        [
          Query.equal('series_id', series.$id),
          Query.notEqual('status', 'draft'),
          Query.orderAsc('series_number'),
          Query.limit(100)
        ]
      );

      window.__renderSeries(series, booksRes.documents);
    }
  } catch (err) {
    console.error('Appwrite load failed:', err);
    window.__renderError(err);
  }
</script>
